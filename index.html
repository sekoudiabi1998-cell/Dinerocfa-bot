<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinero CFA Predictor</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0;padding:0}
.header{padding:15px;background:#0b1224;display:flex;justify-content:space-between;align-items:center}
.card{background:#162032;margin:10px;border-radius:15px;padding:15px}
.progress{height:8px;background:#2a3a56;border-radius:10px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:#00ff9d;width:100%}
.badge{background:#0f2a20;color:#00ff9d;padding:5px 10px;border-radius:20px;font-size:12px}
.jeux{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.jeu{background:#162032;border-radius:15px;overflow:hidden;padding-bottom:8px;cursor:pointer;border:1px solid #23344f}
.jeu img{width:100%;height:140px;object-fit:cover}
.jeu b{display:block;padding:5px 8px}
.tag{background:#00d084;color:#000;font-size:10px;padding:2px 6px;border-radius:5px;margin:5px;display:inline-block}
.signal{color:#00ff9d;font-size:12px;padding-left:8px}
.nav{position:fixed;bottom:0;width:100%;background:#0b1224;display:flex;justify-content:space-around;padding:10px 0}
.nav div{text-align:center;font-size:12px;opacity:0.6}
.nav .active{opacity:1;color:#00ff9d}
#gamePage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#120a2a;z-index:10;padding:15px;box-sizing:border-box}
.btn-pred{background:linear-gradient(90deg,#ff3a3a,#ff00a6);border:none;padding:15px 30px;border-radius:10px;color:#fff;font-weight:bold;width:100%;margin-top:20px;font-size:16px}
.result{background:#1e123a;padding:15px;border-radius:12px;margin-top:15px}
</style>
</head>
<body>

<div id="home">
<div class="header"><b>Dinero-Multi-Games</b><span class="badge">MA</span></div>
<div style="padding:0 10px"><small>Signaux 1Win - Code DINERO06</small></div>

<div class="card">
<div style="display:flex;justify-content:space-between"><small>PROGRESSION DU DÉPÔT</small><span class="badge">🔓 Débloqué</span></div>
<h1 style="margin:10px 0">$1.41 <small style="opacity:0.5">/ $1</small></h1>
<div class="progress"><div class="bar"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:5px"><small>100%</small><small>Signaux actifs</small></div>
</div>

<div class="card" style="display:flex;gap:10px">
<div>✅</div>
<div><b>Accès complet activé</b><br><small style="opacity:0.7">Ouvrez un jeu et appuyez sur PRÉDICTION pour recevoir votre signal.</small></div>
</div>

<div style="display:flex;justify-content:space-between;padding:0 15px"><b>Jeux</b><small>15 jeux</small></div>
<div class="jeux" id="jeuxList"></div>
</div>

<div id="gamePage">
<div class="header"><span onclick="closeGame()" style="cursor:pointer">< Retour</span><b id="gameTitle">LUCKY JET</b><span class="badge">🔓 Signaux actifs</span></div>
<div style="text-align:center;padding:20px"><img id="gameImg" src="" style="width:100%;border-radius:15px;max-height:300px;object-fit:cover"></div>
<button class="btn-pred" onclick="lancerPrediction()">PRÉDICTION</button>
<div id="resultArea"></div>
</div>

<div class="nav">
<div class="active">🎮<br>Jeux</div>
<div>🏆<br>Classement</div>
<div>👤<br>Profil</div>
<div>⚙️<br>Réglages</div>
</div>

<script>
const jeux = [
{name:"AVIATRIX",img:"https://i.imgur.com/8Km9tLL.png"},
{name:"TO THE MOON",img:"https://i.imgur.com/QkZJ5kP.png"},
{name:"LUCKY JET",img:"https://i.imgur.com/Y3p0r5b.png"},
{name:"AVIATOR",img:"https://i.imgur.com/3y1Q6dP.png"},
{name:"CRASH",img:"https://i.imgur.com/8Km9tLL.png"},
{name:"JETX",img:"https://i.imgur.com/QkZJ5kP.png"},
{name:"SPACEMAN",img:"https://i.imgur.com/Y3p0r5b.png"},
{name:"ROCKETMAN",img:"https://i.imgur.com/3y1Q6dP.png"},
{name:"CASH OR CRASH",img:"https://i.imgur.com/8Km9tLL.png"},
{name:"LUCKY LOOPS",img:"https://i.imgur.com/QkZJ5kP.png"},
{name:"BIG BASS CRASH",img:"https://i.imgur.com/Y3p0r5b.png"},
{name:"Mines",img:"https://i.imgur.com/3y1Q6dP.png"},
{name:"Dice",img:"https://i.imgur.com/8Km9tLL.png"},
{name:"Plinko",img:"https://i.imgur.com/QkZJ5kP.png"},
{name:"Keno",img:"https://i.imgur.com/Y3p0r5b.png"},
];

const list = document.getElementById('jeuxList');
jeux.forEach(j=>{
list.innerHTML+=`<div class="jeu" onclick="openGame('${j.name}','${j.img}')"><span class="tag">NOUVEAU</span><img src="${j.img}"><b>${j.name}</b><span class="signal">⚡ Signal prêt</span></div>`;
});

function openGame(name,img){
document.getElementById('gameTitle').innerText=name;
document.getElementById('gameImg').src=img;
document.getElementById('home').style.display='none';
document.getElementById('gamePage').style.display='block';
document.getElementById('resultArea').innerHTML='';
}
function closeGame(){
document.getElementById('home').style.display='block';
document.getElementById('gamePage').style.display='none';
}
function lancerPrediction(){
let area=document.getElementById('resultArea');
area.innerHTML=`<div class="result">⏳ Analyse en cours...</div>`;
setTimeout(()=>{
let mult=(Math.random()*2+1.1).toFixed(2);
let cash=(mult*0.7).toFixed(2);
let heure=new Date().toLocaleTimeString().slice(0,5);
let conf=Math.floor(Math.random()*15+82);
area.innerHTML=`<div class="result"><center>🎯 <b>Signal Calculé</b></center><br>
<div style="display:flex;justify-content:space-between"><span>Multiplicateur</span><b style="color:#00ff9d">x${mult}</b></div><br>
<div style="display:flex;justify-content:space-between"><span>Assurance (cashout)</span><b style="color:#ffcc00">x${cash}</b></div><br>
<div style="display:flex;justify-content:space-between"><span>Heure du signal</span><b>${heure}</b></div><br>
<div style="display:flex;justify-content:space-between"><span>Confiance</span><b>${conf}%</b></div><br>
<center>✅ <b>Bonne opportunité !</b><br><small>Joue sur 1Win avec code DINERO06<br>${"https://1win.ci/betting?p=unoe&sharebet=DINERO06"}</small></center></div>`;
},3000);
}
</script>
</body>
</html>
